server {
    listen 80;
    listen 443 ssl;
    server_name testflowgrok.plxeditor.com;

    root /www/wwwroot/testflowgrok.plxeditor.com;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/testflowgrok.plxeditor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testflowgrok.plxeditor.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /www/wwwlogs/testflowgrok.plxeditor.com.log;
    error_log /www/wwwlogs/testflowgrok.plxeditor.com.error.log;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }
}
